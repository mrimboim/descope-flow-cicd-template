name: '[Reusable] Open Flow Promotion PR'

# Step 1 of the PR-gated flow promotion.
# Exports the chosen flows from SOURCE and commits ONLY those flow files into the
# tracked directory `flows/<target_key>/`, then opens a pull request. The PR diff
# shows exactly which flow definitions will change. Nothing is imported here —
# the deploy workflow (flows-deploy.yml) handles that when the PR is merged.
#
# Visual diffs: when `visual_diffs` is enabled, tools/flow-diff renders git-style
# images of what changed (flow graph, screens via the Descope rendering engine,
# conditions, actions, connectors) and commits them under
# `flow-diffs/<target_key>/<flow_id>/<oldhash>-<newhash>/`.
# The hash-named folder is new on every change and the previous folder is deleted
# in the same commit, so the PR's "Files changed" shows the images as ADDED —
# you only ever see the current diff's images, never an old-vs-new image slider.

on:
  workflow_call:
    inputs:
      source_project_id:
        description: 'Descope project to export flows FROM'
        required: true
        type: string
      target_key:
        description: "Target slug; flows are committed under flows/<target_key>/ (e.g. staging, production)"
        required: true
        type: string
      target_label:
        description: 'Human-readable target name for the PR text'
        required: false
        type: string
        default: ''
      flows:
        description: "Comma-separated flow IDs to promote, or 'all'"
        required: true
        type: string
        default: 'all'
      visual_diffs:
        description: 'Generate visual flow diff images and commit them into the PR'
        required: false
        type: boolean
        default: true
      inline_pr_images:
        description: 'Also inline the diff images in the PR description (requires visual_diffs)'
        required: false
        type: boolean
        default: true
      pixel_render:
        description: 'Render real screens with the Descope engine (installs Chromium; slower CI). Off = graph + structural panels only.'
        required: false
        type: boolean
        default: true
      descope_base_url:
        description: 'Override the Descope base URL'
        required: false
        type: string
        default: 'https://api.descope.com'
      descopecli_version:
        description: 'The version of the descope CLI tool to use'
        required: false
        type: string
        default: 'v0.8.14'
    secrets:
      source_management_key:
        description: 'A management key with access to the source project'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: 'Open PR for flows/${{ inputs.target_key }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Descope CLI
        uses: descope/descopecli/.github/actions/install@main
        with:
          version: ${{ inputs.descopecli_version }}

      - name: Export flows from source project
        env:
          DESCOPE_MANAGEMENT_KEY: ${{ secrets.source_management_key }}
          DESCOPE_BASE_URL: ${{ inputs.descope_base_url }}
        run: |
          set -euo pipefail
          echo "Exporting snapshot from SOURCE project ${{ inputs.source_project_id }}"
          rm -rf ./_source
          mkdir -p ./_source
          descope project snapshot export "${{ inputs.source_project_id }}" --path ./_source
          if [ ! -d ./_source/flows ]; then
            echo "::error::Source snapshot has no flows directory — nothing to promote"
            exit 1
          fi
          echo "Flows available in source:"
          ls -1 ./_source/flows

      - name: Sync selected flows into tracked directory
        env:
          FLOWS: ${{ inputs.flows }}
          TARGET_KEY: ${{ inputs.target_key }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DEST="flows/${TARGET_KEY}"
          mkdir -p "$DEST"

          if [ "$FLOWS" = "all" ]; then
            echo "Staging ALL flows from source into $DEST"
            for d in ./_source/flows/*/; do
              name="$(basename "$d")"
              echo "  - $name"
              rm -rf "$DEST/$name"
              cp -R "$d" "$DEST/$name"
            done
          else
            IFS=',' read -ra IDS <<< "$FLOWS"
            for raw in "${IDS[@]}"; do
              id="$(echo "$raw" | xargs)"
              [ -z "$id" ] && continue
              if [ ! -d "./_source/flows/$id" ]; then
                echo "::error::Flow '$id' not found in source project ${{ inputs.source_project_id }}"
                exit 1
              fi
              echo "  - $id"
              rm -rf "$DEST/$id"
              cp -R "./_source/flows/$id" "$DEST/$id"
            done
          fi

          rm -rf ./_source
          echo "Managed flows under $DEST:"
          ls -1 "$DEST"

      # At this point the working tree holds the NEW flow directories while HEAD
      # still holds what's currently deployed to the target — exactly the two
      # versions the visual diff needs. Each snapshot flow is a DIRECTORY
      # (contents.json + metadata.json + screen-*.json); flow_diff.py accepts the
      # directory directly.
      - name: Generate visual flow diffs
        if: ${{ inputs.visual_diffs }}
        env:
          TARGET_KEY: ${{ inputs.target_key }}
          PIXEL: ${{ inputs.pixel_render }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pip install --quiet cairosvg
          EXTRA=""
          if [ "$PIXEL" = "true" ]; then
            (cd tools/flow-diff \
              && npm install --no-audit --no-fund \
              && npx playwright-core install --with-deps chromium-headless-shell)
          else
            EXTRA="--no-pixel"
          fi

          # previous run's images are removed in this same commit, so the PR only
          # ever contains the current diff's images (shown as ADDED files)
          rm -rf "flow-diffs/$TARGET_KEY"

          for d in flows/$TARGET_KEY/*/; do
            d="${d%/}"
            id="$(basename "$d")"

            if ! git rev-parse -q --verify "HEAD:$d" >/dev/null 2>&1; then
              echo "  - $id: new flow (no previous version), skipping visual diff"
              continue
            fi
            if [ -z "$(git status --porcelain -- "$d")" ]; then
              echo "  - $id: unchanged"
              continue
            fi

            # reconstruct the OLD flow directory from HEAD
            rm -rf /tmp/old-flow && mkdir -p /tmp/old-flow
            git archive HEAD -- "$d" | tar -x -C /tmp/old-flow

            oldh="$(git rev-parse "HEAD:$d" | cut -c1-7)"
            newh="$(find "$d" -type f -print0 | sort -z | xargs -0 sha1sum | sha1sum | cut -c1-7)"
            out="flow-diffs/$TARGET_KEY/$id/$oldh-$newh"
            echo "  - $id: $oldh -> $newh"
            python3 tools/flow-diff/flow_diff.py "/tmp/old-flow/$d" "$d" -o "$out" $EXTRA
            rm -f "$out/.pixel-changes.json"
          done

      - name: Compose PR body
        env:
          TARGET_KEY: ${{ inputs.target_key }}
          TARGET_LABEL: ${{ inputs.target_label || inputs.target_key }}
          SOURCE_PROJECT: ${{ inputs.source_project_id }}
          FLOWS: ${{ inputs.flows }}
          INLINE: ${{ inputs.visual_diffs && inputs.inline_pr_images }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BODY=/tmp/pr-body.md
          cat > "$BODY" << EOF
          ### Flow promotion

          - **Source project:** \`$SOURCE_PROJECT\`
          - **Target:** \`$TARGET_LABEL\`
          - **Flows:** \`$FLOWS\`

          This PR updates the managed flow set under \`flows/$TARGET_KEY/\`.
          The diff below is exactly which flow definitions will change.

          On merge, the **Flows 2 — Deploy** workflow exports a fresh snapshot of the
          target, swaps these flows in, validates, and imports — leaving connectors and
          all other settings in place.
          EOF

          if [ "$INLINE" = "true" ]; then
            shopt -s nullglob
            RAW="https://github.com/$REPO/raw/descope/promote-flows-$TARGET_KEY"
            for dir in flow-diffs/$TARGET_KEY/*/*/; do
              dir="${dir%/}"
              id="$(basename "$(dirname "$dir")")"
              {
                echo ""
                echo "<details>"
                echo "<summary><b>🖼 Visual diff: ${id}</b> — click to expand</summary>"
                echo ""
                for img in "$dir"/*.png; do
                  echo "![$(basename "$img" .png)]($RAW/$img)"
                  echo ""
                done
                echo "</details>"
              } >> "$BODY"
            done
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: descope/promote-flows-${{ inputs.target_key }}
          delete-branch: true
          add-paths: |
            flows/${{ inputs.target_key }}
            flow-diffs/${{ inputs.target_key }}
          assignees: ${{ github.actor }}
          commit-message: 'Promote flows -> ${{ inputs.target_key }}'
          title: 'Promote flows -> ${{ inputs.target_label || inputs.target_key }}'
          body-path: /tmp/pr-body.md
